databases:
  - name: solace7-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: solace7
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: solace7-db
          property: connectionString
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
